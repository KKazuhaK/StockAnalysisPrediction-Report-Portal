name: Release

# One pipeline produces both the GitHub Release archives and the ghcr.io multi-arch image from one
# batch of binaries. Pattern borrowed from KazuhaHub/Passwall-Sub-Panel:
#
#   web     → build the SPA (Vite) once and reuse it as an artifact (the old shape rebuilt it inside
#             every matrix leg = wasted work)
#   build   → matrix cross-compiles 6 platforms, downloads the web bundle into web/dist and
#             //go:embed-s it into the binary
#   release → tar/zip + SHA256, publishes the GitHub Release
#   docker  → reuses the linux amd64/arm64 binaries to push a multi-arch image (no in-container
#             build, so no QEMU)
#
# A binary verified from the Release is byte-for-byte the one in the image (the same artifact).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.0.0"
        required: true
        type: string

# Least privilege by default; the two jobs that write override it (release -> GitHub Release,
# docker -> ghcr.io). Everything else inherits contents: read, so a compromised build step cannot
# push to the repository.
permissions:
  contents: read

jobs:
  setup:
    name: Resolve tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.t.outputs.tag }}
      owner_lc: ${{ steps.t.outputs.owner_lc }}
      repo_lc: ${{ steps.t.outputs.repo_lc }}
    steps:
      - id: t
        shell: bash
        # Passed through env rather than interpolated into the script: a workflow_dispatch input is
        # user-controlled text, and "${{ inputs.tag }}" inside a run: block is how a shell injection
        # enters a release pipeline.
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
          else
            tag="$GITHUB_REF_NAME"
          fi
          owner_lc="$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')"
          repo_lc="$(printf '%s' "$REPO" | tr '[:upper:]' '[:lower:]')"
          {
            echo "tag=${tag}"
            echo "owner_lc=${owner_lc}"
            echo "repo_lc=${repo_lc}"
          } >> "$GITHUB_OUTPUT"

  web:
    name: Build web assets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: setup
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install deps
        working-directory: web
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Build SPA bundle
        working-directory: web
        run: npm run build # vite outputs to ../internal/web/dist for go:embed
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: internal/web/dist
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [setup, web]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64, ext: "" }
          - { goos: linux, goarch: arm64, ext: "" }
          - { goos: darwin, goarch: amd64, ext: "" }
          - { goos: darwin, goarch: arm64, ext: "" }
          - { goos: windows, goarch: amd64, ext: ".exe" }
          - { goos: windows, goarch: arm64, ext: ".exe" }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Download web bundle
        uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: internal/web/dist
      - name: Build report-portal
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          VERSION: ${{ needs.setup.outputs.tag }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p out
          mod=github.com/KazuhaHub/StockAnalysisPrediction-Report-Portal
          short_sha="${COMMIT:0:7}"
          build_date="$(date -u +%FT%TZ)"
          ldflags="-s -w"
          ldflags+=" -X ${mod}/internal/version.Version=${VERSION}"
          ldflags+=" -X ${mod}/internal/version.Commit=${short_sha}"
          ldflags+=" -X ${mod}/internal/version.BuildDate=${build_date}"
          go build -trimpath -ldflags="${ldflags}" -o "out/report-portal${{ matrix.ext }}" ./cmd/report-portal
      - uses: actions/upload-artifact@v7
        with:
          name: report-portal-${{ matrix.goos }}-${{ matrix.goarch }}
          path: out/report-portal${{ matrix.ext }}
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    # Waits on docker, not just build, for two reasons. A gate can only gate what it precedes: run
    # the two in parallel and either failure below lands after the Release is already public and its
    # archives are downloadable.
    #   1. The image build runs the glyph gate (scripts/probe-font-coverage.sh, in the runtime-base
    #      stage of Dockerfile.release) on both arches. test.yml's font-image job gates amd64
    #      pre-merge, so by tag time this is re-verification — except on arm64, first checked here.
    #   2. The release body advertises `docker pull ghcr.io/...:${VERSION}` (generated below).
    #      Publishing ahead of the push means a Release page pointing at a tag ghcr.io lacks.
    # Costs the release job the image build's wall clock. Note the scope: an archive ships neither
    # fonts nor wkhtmltopdf, so a tarball's glyph coverage is whatever its host provides
    # (internal/app/pdf.go resolves the binary from PATH). The gate is a property of the image.
    needs: [setup, build, docker]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: report-portal-*
      - name: Package archives
        shell: bash
        env:
          VERSION: ${{ needs.setup.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist build
          for dir in artifacts/report-portal-*; do
            np="${dir#artifacts/report-portal-}"   # e.g. linux-amd64
            goos="${np%-*}"; goarch="${np##*-}"
            ext=""; [ "$goos" = "windows" ] && ext=".exe"
            pkg="report-portal_${VERSION}_${goos}_${goarch}"
            mkdir -p "build/${pkg}"
            cp "${dir}/report-portal${ext}" "build/${pkg}/"
            chmod +x "build/${pkg}/report-portal${ext}" || true
            # README + example config + LICENSE are tracked files; a missing one must fail the
            # release loudly rather than ship an incomplete archive.
            cp README.md config.example.yaml LICENSE "build/${pkg}/"
            if [ "$goos" = "windows" ]; then
              (cd build && zip -qr "../dist/${pkg}.zip" "${pkg}")
            else
              tar -C build -czf "dist/${pkg}.tar.gz" "${pkg}"
            fi
          done
          (cd dist && sha256sum -- * > SHA256SUMS.txt)
      - name: Generate release body
        shell: bash
        env:
          VERSION: ${{ needs.setup.outputs.tag }}
          OWNER_LC: ${{ needs.setup.outputs.owner_lc }}
          REPO_LC: ${{ needs.setup.outputs.repo_lc }}
        run: |
          set -euo pipefail
          notes_file="docs/releases/${VERSION}.md"
          if [ -f "${notes_file}" ]; then
            cat "${notes_file}" > release_notes.md
            printf '\n' >> release_notes.md
          else
            : > release_notes.md
          fi
          cat <<EOF >> release_notes.md
          ### Container image (ghcr.io)

          \`\`\`shell
          docker pull ghcr.io/${OWNER_LC}/${REPO_LC}:latest
          # or pin a version
          docker pull ghcr.io/${OWNER_LC}/${REPO_LC}:${VERSION}
          \`\`\`

          ### Verify

          \`\`\`shell
          sha256sum -c SHA256SUMS.txt
          \`\`\`
          EOF
      - uses: softprops/action-gh-release@v3
        with:
          # The default GITHUB_TOKEN (github-actions[bot]) is blocked from creating releases on
          # this repo (403 "Resource not accessible by integration") despite contents:write, so
          # the release is created with a PAT stored as the RELEASE_PAT secret instead.
          token: ${{ secrets.RELEASE_PAT }}
          tag_name: ${{ needs.setup.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.setup.outputs.tag }}
          # A "-" suffix (e.g. v1.0.0-beta) marks a pre-release; /releases/latest excludes it.
          prerelease: ${{ contains(needs.setup.outputs.tag, '-') }}
          generate_release_notes: true
          body_path: release_notes.md
          append_body: true
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}

  docker:
    name: Publish container image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    needs: [setup, build]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with: { name: report-portal-linux-amd64, path: bin/linux-amd64 }
      - uses: actions/download-artifact@v8
        with: { name: report-portal-linux-arm64, path: bin/linux-arm64 }
      - run: chmod +x bin/linux-amd64/report-portal bin/linux-arm64/report-portal
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ needs.setup.outputs.owner_lc }}/${{ needs.setup.outputs.repo_lc }}
          # Two rolling channels:
          #   :latest -> tracks only the newest stable release (pre-releases excluded)
          #   :beta   -> tracks the newest release including pre-releases, always "current"
          tags: |
            type=raw,value=${{ needs.setup.outputs.tag }}
            type=raw,value=latest,enable=${{ startsWith(needs.setup.outputs.tag, 'v') && !contains(needs.setup.outputs.tag, '-') }}
            type=raw,value=beta,enable=${{ startsWith(needs.setup.outputs.tag, 'v') }}
          labels: |
            org.opencontainers.image.title=report-portal
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.setup.outputs.tag }}
      - name: Build and push multi-arch image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.release
          # No QEMU: Dockerfile.release only COPYs the prebuilt per-arch binary; the debian base
          # image itself is multi-arch.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          # Registry cache, not the per-branch GitHub cache: every tag is a new ref, so type=gha
          # would start cold on each release and re-download ~35 MB of fonts plus the wkhtmltopdf
          # deb per arch. Both the fonts and apt layers live in ghcr instead and are reused across
          # releases. The first release after this change populates the cache (~3 min); later ones
          # only rebuild the COPY layers.
          cache-from: type=registry,ref=ghcr.io/${{ needs.setup.outputs.owner_lc }}/${{ needs.setup.outputs.repo_lc }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ needs.setup.outputs.owner_lc }}/${{ needs.setup.outputs.repo_lc }}:buildcache,mode=max

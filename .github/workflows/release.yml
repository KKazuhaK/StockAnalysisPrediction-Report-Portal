name: Release

# One pipeline produces the release archives, the fixed ghcr.io image tag, and a DRAFT GitHub
# Release from one batch of binaries:
#
#   setup   → resolve the tag, refuse anything that is not a CalVer tag, resolve the peeled commit
#   web     → build the SPA (Vite) once and reuse it as an artifact (rebuilding it inside every
#             matrix leg would be wasted work)
#   build   → matrix cross-compiles 6 platforms, downloads the web bundle into web/internal/dist and
#             //go:embed-s it into the binary
#   release → tar/zip + SHA256SUMS, then create or update the DRAFT GitHub Release
#   docker  → reuse the linux amd64/arm64 binaries to push the FIXED multi-arch image tag, then
#             attach the durable identity (commit + image digest) to the draft
#
# Nothing here decides maturity, and nothing here moves a rolling channel. Whether this release is a
# pre-release or a full release is GitHub Release metadata chosen at publication, and :latest / :beta
# are owned by release-channels.yml, which promotes the already-published bytes by digest and never
# rebuilds. Tag spelling selects nothing. See docs/adr/0034.
#
# A binary verified from the Release is byte-for-byte the one in the image (the same artifact).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v2026.38.1"
        required: true
        type: string
      maturity:
        # Optional, and only an initializer: the maintainer sets the real value when publishing the
        # draft. This exists so a rehearsal can exercise the pre-release path without clicking.
        description: "Initial GitHub Release maturity"
        required: false
        type: choice
        default: "unset"
        options: ["unset", "prerelease", "release"]

# Least privilege by default; the two jobs that write override it (release -> GitHub Release,
# docker -> ghcr.io). Everything else inherits contents: read, so a compromised build step cannot
# push to the repository.
permissions:
  contents: read

# Publisher jobs run with no go.work and no silent toolchain switch, mirroring test.yml.
env:
  GOWORK: "off"
  GOTOOLCHAIN: "local"

# Serialize releases, and never cancel one in flight: two overlapping runs would race the release
# page and the fixed image tag. The rolling channels have their own serialization in
# release-channels.yml, because an event there is independent of this pipeline.
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  setup:
    name: Resolve and validate tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.t.outputs.tag }}
      sha: ${{ steps.t.outputs.sha }}
      owner_lc: ${{ steps.t.outputs.owner_lc }}
      repo_lc: ${{ steps.t.outputs.repo_lc }}
    steps:
      - uses: actions/checkout@v6
        with:
          # The validator is a repository file, so the tag is judged by exactly the rules
          # scripts/tag-release.sh applies — one implementation, not two that can drift.
          fetch-depth: 0
          fetch-tags: true
      - id: t
        shell: bash
        # Passed through env rather than interpolated into the script: a workflow_dispatch input is
        # user-controlled text, and "${{ inputs.tag }}" inside a run: block is how a shell injection
        # enters a release pipeline.
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
            # A dispatch from main would build main's code and label it with the tag. Require the
            # selected ref to be the tag itself, so the checkout below is the tagged commit.
            if [ "$GITHUB_REF" != "refs/tags/${tag}" ]; then
              echo "::error::select the ${tag} tag as the workflow ref when dispatching"
              exit 1
            fi
          else
            tag="$GITHUB_REF_NAME"
          fi

          echo "::group::Validate the tag"
          . scripts/lib/calver.sh
          if ! calver_valid "$tag"; then
            echo "::error::$tag is not a CalVer release tag. Expected vYYYY.W[.R] — the ISO"
            echo "::error::week-numbering year, the UTC ISO week the series starts in, and an optional"
            echo "::error::revision. No leading zeroes, no maturity suffix, no extra components."
            exit 1
          fi
          echo "$tag is a well-formed CalVer tag"
          echo "::endgroup::"

          if ! git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            git fetch --force --no-tags origin "refs/tags/${tag}:refs/tags/${tag}" || {
              echo "::error::no tag ${tag} on origin"; exit 1; }
          fi
          # Annotated tags only: the annotation carries the release note, and a lightweight tag
          # carries no identity of its own to check the build against.
          obj=$(git rev-parse --verify "refs/tags/${tag}")
          if [ "$(git cat-file -t "$obj")" != "tag" ]; then
            echo "::error::${tag} is a lightweight tag; release tags are annotated (scripts/tag-release.sh)"
            exit 1
          fi
          # Peel to the commit: the tag object's own sha is not what the build must be checked out
          # at or verified against, and conflating the two is how a binary ends up labelled with a
          # revision it was not built from.
          sha=$(git rev-parse --verify "refs/tags/${tag}^{commit}")

          owner_lc="$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')"
          repo_lc="$(printf '%s' "$REPO" | tr '[:upper:]' '[:lower:]')"
          {
            echo "tag=${tag}"
            echo "sha=${sha}"
            echo "owner_lc=${owner_lc}"
            echo "repo_lc=${repo_lc}"
          } >> "$GITHUB_OUTPUT"

  web:
    name: Build web assets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: setup
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.setup.outputs.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install deps
        working-directory: web
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Build SPA bundle
        working-directory: web
        run: npm run build # vite outputs to ../internal/web/dist for go:embed
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: internal/web/dist
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [setup, web]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64, ext: "" }
          - { goos: linux, goarch: arm64, ext: "" }
          - { goos: darwin, goarch: amd64, ext: "" }
          - { goos: darwin, goarch: arm64, ext: "" }
          - { goos: windows, goarch: amd64, ext: ".exe" }
          - { goos: windows, goarch: arm64, ext: ".exe" }
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.setup.outputs.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          # Deliberately uncached: a published binary must not come out of a shared, mutable build
          # cache. Recompiling from the checksum-verified module set costs a minute per leg and
          # buys determinism for the artifact users verify. (Pattern from Passwall-Sub-Panel.)
          cache: false
      - name: Download web bundle
        uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: internal/web/dist
      - name: Build report-portal
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          VERSION: ${{ needs.setup.outputs.tag }}
          COMMIT: ${{ needs.setup.outputs.sha }}
        run: |
          set -euo pipefail
          mkdir -p out
          mod=$(go list -m)
          short_sha="${COMMIT:0:7}"
          build_date="$(date -u +%FT%TZ)"
          ldflags="-s -w"
          ldflags+=" -X ${mod}/internal/version.Version=${VERSION}"
          ldflags+=" -X ${mod}/internal/version.Commit=${short_sha}"
          ldflags+=" -X ${mod}/internal/version.BuildDate=${build_date}"
          go build -trimpath -ldflags="${ldflags}" -o "out/report-portal${{ matrix.ext }}" ./cmd/report-portal
          # Prove the binary carries the provenance we think it does. go version -m reads it from
          # the binary itself, so a wrong module path (which makes every -X a silent no-op) or a
          # checkout of the wrong commit cannot pass.
          sh scripts/check-release-build.sh "out/report-portal${{ matrix.ext }}" "$GOOS" "$GOARCH" "$COMMIT"
      - uses: actions/upload-artifact@v7
        with:
          name: report-portal-${{ matrix.goos }}-${{ matrix.goarch }}
          path: out/report-portal${{ matrix.ext }}
          if-no-files-found: error
          retention-days: 1

  release:
    name: Prepare the draft Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    needs: [setup, build]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.setup.outputs.sha }}
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: report-portal-*
      - name: Refuse a tag whose release is already published
        shell: bash
        env:
          VERSION: ${{ needs.setup.outputs.tag }}
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Published artifacts are never replaced. A draft is still open for revision — that is
          # exactly what "draft" means — but a published release is finished, so re-running this
          # pipeline over it is a mistake, not a repair. Changed artifacts need a new revision.
          #
          # The existence test is the exit status, never the captured output: `gh api` writes the 404
          # body to STDOUT, so `$(gh api ... || echo absent)` yields the error JSON concatenated with
          # the fallback, matching no branch and refusing every first attempt. That is not a theory —
          # it is what the first run of this workflow did, and the rehearsal it broke is why the
          # guard is written this way.
          if ! body=$(gh api "repos/${REPO}/releases/tags/${VERSION}" 2>/dev/null); then
            echo "no release yet for ${VERSION}; preparing a draft"
          elif [ "$(printf '%s' "$body" | jq -r '.draft')" = "true" ]; then
            echo "an existing draft for ${VERSION} will be updated in place"
          else
            echo "::error::${VERSION} is already published; published artifacts are never replaced."
            echo "::error::Cut the next revision instead (scripts/tag-release.sh vYYYY.W[.R])."
            exit 1
          fi
      - name: Package archives
        shell: bash
        env:
          VERSION: ${{ needs.setup.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist build
          # Exactly six platforms or the release is incomplete; a missing artifact must not ship
          # as a five-platform release with a green check.
          set -- artifacts/report-portal-*
          test "$#" = 6 || { echo "expected 6 platform artifacts, found $#"; exit 1; }
          for dir in artifacts/report-portal-*; do
            np="${dir#artifacts/report-portal-}"   # e.g. linux-amd64
            goos="${np%-*}"; goarch="${np##*-}"
            ext=""; [ "$goos" = "windows" ] && ext=".exe"
            pkg="report-portal_${VERSION}_${goos}_${goarch}"
            mkdir -p "build/${pkg}"
            cp "${dir}/report-portal${ext}" "build/${pkg}/"
            chmod +x "build/${pkg}/report-portal${ext}" || true
            # README + example config + LICENSE are tracked files; a missing one must fail the
            # release loudly rather than ship an incomplete archive.
            cp README.md config.example.yaml LICENSE "build/${pkg}/"
            if [ "$goos" = "windows" ]; then
              (cd build && zip -qr "../dist/${pkg}.zip" "${pkg}")
            else
              tar -C build -czf "dist/${pkg}.tar.gz" "${pkg}"
            fi
          done
          (cd dist && sha256sum -- * > SHA256SUMS.txt)
      - name: Generate release body
        shell: bash
        env:
          VERSION: ${{ needs.setup.outputs.tag }}
          OWNER_LC: ${{ needs.setup.outputs.owner_lc }}
          REPO_LC: ${{ needs.setup.outputs.repo_lc }}
        run: |
          set -euo pipefail
          notes_file="docs/releases/${VERSION}.md"
          if [ -f "${notes_file}" ]; then
            cat "${notes_file}" > release_notes.md
            printf '\n' >> release_notes.md
          else
            : > release_notes.md
          fi
          # The fixed tag only. This body cannot promise :latest, because at draft time nobody has
          # decided whether this is a pre-release or a full release — that decision moves the
          # channel, and it happens at publication, not here.
          cat <<EOF >> release_notes.md
          ### Container image (ghcr.io)

          \`\`\`shell
          docker pull ghcr.io/${OWNER_LC}/${REPO_LC}:${VERSION}
          \`\`\`

          This fixed tag is this artifact set and is never repointed. Whether it also becomes
          \`:latest\` is decided when this release is published as a full release; \`:beta\` follows
          the newest published release.

          ### Verify

          \`\`\`shell
          sha256sum -c SHA256SUMS.txt
          \`\`\`
          EOF
      - name: Recheck the immutable tag before publication
        shell: bash
        env:
          VERSION: ${{ needs.setup.outputs.tag }}
          EXPECTED_SHA: ${{ needs.setup.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin "refs/tags/${VERSION}:refs/tags/${VERSION}"
          actual=$(git rev-parse --verify "refs/tags/${VERSION}^{commit}")
          test "$actual" = "$EXPECTED_SHA" || {
            echo "::error::tag ${VERSION} moved during the build; refusing publication"
            exit 1
          }
      - uses: softprops/action-gh-release@v3
        with:
          # The default GITHUB_TOKEN (github-actions[bot]) is blocked from creating releases on
          # this repo (403 "Resource not accessible by integration") despite contents:write, so
          # the release is created with a PAT stored as the RELEASE_PAT secret instead.
          token: ${{ secrets.RELEASE_PAT }}
          tag_name: ${{ needs.setup.outputs.tag }}
          target_commitish: ${{ needs.setup.outputs.sha }}
          name: ${{ needs.setup.outputs.tag }}
          # Always a draft. Maturity is chosen by the maintainer when publishing, and release-channels
          # reacts to that. Tag spelling never decides it, which is why there is no contains("-") here.
          draft: true
          prerelease: ${{ inputs.maturity == 'prerelease' }}
          generate_release_notes: true
          body_path: release_notes.md
          # Replace rather than append, so a re-run of a failed pipeline converges on one body instead
          # of stacking a second copy of the notes onto the draft.
          append_body: false
          fail_on_unmatched_files: true
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}

  docker:
    name: Publish the fixed image tag
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    # Runs after the draft exists: the draft is invisible until a human publishes it, while a pushed
    # image tag is public immediately, so the irreversible step goes second. The image build also
    # runs the glyph gate (scripts/probe-font-coverage.sh, in the runtime-base stage of
    # Dockerfile.release) on both arches — test.yml's docker-image job gates amd64 pre-merge, so by
    # tag time this is re-verification except on arm64, which is first checked here.
    needs: [setup, build, release]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.setup.outputs.sha }}
      - uses: actions/download-artifact@v8
        with: { name: report-portal-linux-amd64, path: bin/linux-amd64 }
      - uses: actions/download-artifact@v8
        with: { name: report-portal-linux-arm64, path: bin/linux-arm64 }
      - run: chmod +x bin/linux-amd64/report-portal bin/linux-arm64/report-portal
      - name: Recheck the immutable tag before image publication
        shell: bash
        env:
          VERSION: ${{ needs.setup.outputs.tag }}
          EXPECTED_SHA: ${{ needs.setup.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin "refs/tags/${VERSION}:refs/tags/${VERSION}"
          actual=$(git rev-parse --verify "refs/tags/${VERSION}^{commit}")
          test "$actual" = "$EXPECTED_SHA" || {
            echo "::error::tag ${VERSION} moved during the build; refusing publication"
            exit 1
          }
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse to replace an already-published fixed tag
        shell: bash
        env:
          IMAGE: ghcr.io/${{ needs.setup.outputs.owner_lc }}/${{ needs.setup.outputs.repo_lc }}
          VERSION: ${{ needs.setup.outputs.tag }}
        run: |
          set -euo pipefail
          # The fixed tag is the published artifact set. A draft GitHub Release does NOT make it
          # private, so once it exists the bytes are out and re-pushing a rebuild — which differs,
          # because the build date is baked in — would silently change what that number means.
          if docker buildx imagetools inspect "${IMAGE}:${VERSION}" >/dev/null 2>&1; then
            echo "::error::${IMAGE}:${VERSION} already exists and published bytes are never replaced."
            echo "::error::Cut the next revision, or finish the existing release from its draft."
            exit 1
          fi
          echo "no existing ${IMAGE}:${VERSION}; safe to publish"
      - name: Build and push the fixed multi-arch image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.release
          # No QEMU: Dockerfile.release only COPYs the prebuilt per-arch binary; the debian base
          # image itself is multi-arch.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ needs.setup.outputs.owner_lc }}/${{ needs.setup.outputs.repo_lc }}:${{ needs.setup.outputs.tag }}
          labels: |
            org.opencontainers.image.title=report-portal
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.setup.outputs.sha }}
            org.opencontainers.image.version=${{ needs.setup.outputs.tag }}
          provenance: false
          # Registry cache, not the per-branch GitHub cache: every tag is a new ref, so type=gha
          # would start cold on each release and re-download ~35 MB of fonts plus the wkhtmltopdf
          # deb per arch. Both the fonts and apt layers live in ghcr instead and are reused across
          # releases. The first release after this change populates the cache (~3 min); later ones
          # only rebuild the COPY layers.
          cache-from: type=registry,ref=ghcr.io/${{ needs.setup.outputs.owner_lc }}/${{ needs.setup.outputs.repo_lc }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ needs.setup.outputs.owner_lc }}/${{ needs.setup.outputs.repo_lc }}:buildcache,mode=max
      - name: Record the durable release identity on the draft
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.setup.outputs.tag }}
          COMMIT: ${{ needs.setup.outputs.sha }}
          DIGEST: ${{ steps.push.outputs.digest }}
          IMAGE: ghcr.io/${{ needs.setup.outputs.owner_lc }}/${{ needs.setup.outputs.repo_lc }}
        run: |
          set -euo pipefail
          # Durable, because a one-day Actions artifact cannot carry an artifact identity to a
          # promotion that happens days later, and reconciliation needs the digest without pulling
          # the image back. `recorded_at` is when this identity was written; the artifact's own build
          # date is baked into the binary by the -ldflags above and is the authoritative one.
          jq -n --arg tag "$VERSION" --arg commit "$COMMIT" --arg image "$IMAGE" \
                --arg digest "$DIGEST" --arg recorded "$(date -u +%FT%TZ)" \
            '{tag: $tag, commit: $commit, image: $image, digest: $digest, recorded_at: $recorded}' \
            > release-metadata.json
          cat release-metadata.json
          # --clobber so a retry of this step converges instead of failing on the file it wrote.
          gh release upload "$VERSION" release-metadata.json --clobber
